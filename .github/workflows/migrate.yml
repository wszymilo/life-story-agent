name: Database Migrations

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'up'
        type: choice
        options:
          - up
          - down
          - status

jobs:
  migrate:
    name: Run Aurora Migrations
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Get DB password from Secrets Manager
        id: db-pass
        run: |
          DB_PASS=$(aws secretsmanager get-secret-value \
            --secret-id '${{ vars.DB_CREDENTIALS_ARN }}' \
            --query 'SecretString' \
            --output text)
          echo "DB_PASS=$DB_PASS" >> $GITHUB_OUTPUT

      - name: Run migrations
        run: |
          docker run --rm \
            -e PGPASSWORD='${{ steps.db-pass.outputs.DB_PASS }}' \
            postgres:16-alpine \
            psql -h '${{ vars.AURORA_ENDPOINT }}' \
              -U dbadmin \
              -d life_story_agent \
              -f /migration/001_aurora_schema.sql
