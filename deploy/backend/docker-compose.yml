services:
  # Port publishing is environment-specific and lives in the override files
  # (docker-compose.local.yml for dev, docker-compose.prod.yml for prod).
  # Compose v2 APPENDS ports across override files, so defining them here as
  # well would duplicate the bind and fail with "address already in use".
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../deploy/backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB: life_story_agent
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d life_story_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../..
      dockerfile: deploy/backend/Dockerfile
    restart: unless-stopped
    volumes:
      - audio-data:/data/audio-recordings
      # Bind mount source code (not .venv) for hot-reload
      - ../../app/api:/app/api:ro
      - ../../app/config.py:/app/config.py:ro
      - ../../app/db:/app/db:ro
      - ../../app/main.py:/app/main.py:ro
      - ../../app/services:/app/services:ro
      - ../../app/utils:/app/utils:ro
      # Mount root .env so config.py's load_dotenv(find_dotenv()) finds it
      - ../../.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://app:${DB_PASSWORD:-devpassword}@postgres:5432/life_story_agent
      AUDIO_STORAGE_PATH: /data/audio-recordings
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173

volumes:
  pgdata:
  audio-data:
