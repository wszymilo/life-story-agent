[project]
name = "app"
version = "0.1.0"
description = "Life Story Agent Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "asyncpg>=0.30",
    "aiofiles>=24.1.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "ruff>=0.15.10",
    "openai>=2.32.0",
    "coverage>=7.13.5",
    "pytest-coverage>=0.0",
    "sentry-sdk>=2.58.0",
    "langfuse>=4.5.0",
    "slowapi>=0.1.9",
    "firebase-admin>=6.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "vulture>=2.11",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.setuptools.packages.find]
include = ["api*", "db*", "services*", "utils*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["W291"]  # Trailing whitespace (unavoidable in multi-line f-strings)

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "api.routes.*"
ignore_all_errors = true
