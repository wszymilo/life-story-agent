name: Database Migrations

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'up'
        type: choice
        options:
          - up
          - down
          - status

jobs:
  migrate:
    name: Run Aurora Migrations
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Get DB password from Secrets Manager
        id: db-pass
        if: inputs.action != 'status'
        run: |
          DB_PASS=$(aws secretsmanager get-secret-value \
            --secret-id '${{ vars.DB_CREDENTIALS_ARN }}' \
            --query 'SecretString' \
            --output text)
          echo "DB_PASS=$DB_PASS" >> $GITHUB_OUTPUT

      - name: Run migrations (up)
        if: inputs.action == 'up'
        run: |
          docker run --rm \
            -e PGPASSWORD='${{ steps.db-pass.outputs.DB_PASS }}' \
            -v $GITHUB_WORKSPACE:/migrations \
            postgres:16-alpine \
            psql -h '${{ vars.AURORA_ENDPOINT }}' \
              -U dbadmin \
              -d life_story_agent \
              -f /migrations/supabase/migrations/001_aurora_schema.sql

      - name: Run migrations (down)
        if: inputs.action == 'down'
        run: |
          echo "Down migrations are not implemented. Use 'up' to apply migrations or 'destroy' to remove the infrastructure."

      - name: Check DB status
        if: inputs.action == 'status'
        run: |
          echo "=== Aurora DB Status Check ==="
          echo ""
          echo "1. Testing connection to Aurora..."
          docker run --rm \
            -e PGPASSWORD='dummy' \
            postgres:16-alpine \
            timeout 10 \
            psql -h '${{ vars.AURORA_ENDPOINT }}' \
              -U dbadmin \
              -d life_story_agent \
              -c "SELECT 1 as alive;" \
            && echo "✓ Aurora is alive and accessible" \
            || echo "✗ Aurora is not accessible (may be paused or network issue)"
          echo ""
          echo "2. Checking for expected tables..."
          docker run --rm \
            -e PGPASSWORD='dummy' \
            postgres:16-alpine \
            timeout 10 \
            psql -h '${{ vars.AURORA_ENDPOINT }}' \
              -U dbadmin \
              -d life_story_agent \
              -c "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' ORDER BY table_name;" \
            || echo "✗ Could not query tables (Aurora may be paused or schema not created)"
