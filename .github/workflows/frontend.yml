name: Deploy Frontend

on:
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Build & Deploy React PWA
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.FRONTEND_API_URL }}
          VITE_COGNITO_REGION: eu-west-1
          VITE_COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Upload to S3
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        run: |
          aws s3 sync dist/ s3://${{ vars.FRONTEND_BUCKET }}/ \
            --delete \
            --cache-control "max-age=31536000,immutable"

      - name: Create CloudFront invalidation
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        id: invalidation
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CF_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "Waiting for invalidation $INVALIDATION_ID to complete..."
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ vars.CF_DISTRIBUTION_ID }} \
            --id "$INVALIDATION_ID"
          echo "✅ Invalidation complete"

      - name: Print deployment info
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        run: |
          CF_DOMAIN=$(aws cloudfront get-distribution \
            --id ${{ vars.CF_DISTRIBUTION_ID }} \
            --query 'Distribution.DomainName' \
            --output text)

          {
            echo "## ✅ Frontend Deployed"
            echo ""
            echo "### 🌐 URLs"
            echo "- **[App URL](https://${CF_DOMAIN})**"
            echo "- **[GitHub Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})**"
            echo ""
            echo "### 📋 Quick Links"
            echo "- [Open Application](https://${CF_DOMAIN})"
            echo "- [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> $GITHUB_STEP_SUMMARY
