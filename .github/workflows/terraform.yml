name: Terraform Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to perform'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan

jobs:
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: write
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
          terraform_wrapper: true

      - name: Terraform Init
        id: init
        run: |
          cd terraform && terraform init \
            -backend-config="bucket=${{ secrets.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=production/terraform.tfstate" \
            -backend-config="region=eu-west-1" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${{ secrets.TERRAFORM_DDB_TABLE }}"

      - name: Terraform Format Check
        if: inputs.action == 'plan' || inputs.action == 'apply'
        id: fmt
        run: |
          cd terraform && terraform fmt -check -recursive || true

      - name: Terraform Validate
        if: inputs.action == 'plan' || inputs.action == 'apply'
        id: validate
        run: |
          cd terraform && terraform validate

      - name: Terraform Plan
        if: inputs.action == 'plan' || inputs.action == 'apply'
        id: plan
        run: |
          cd terraform && terraform plan -no-color

      - name: Terraform Apply
        if: inputs.action == 'apply'
        id: apply
        run: |
          cd terraform && terraform apply -auto-approve

      - name: Aurora DB Backup
        if: inputs.action == 'destroy'
        run: |
          set +e  # Continue even if backup fails
          echo "=== Aurora DB Backup ==="
          DB_PASS=$(aws secretsmanager get-secret-value \
            --secret-id '${{ vars.DB_CREDENTIALS_ARN }}' \
            --query 'SecretString' \
            --output text)
          DUMP_FILE="/tmp/aurora-backup-$(date +%Y%m%d-%H%M%S).sql"
          TIMEOUT_CMD="timeout 30"  # 30 second timeout for Aurora wake-up

          $TIMEOUT_CMD docker run --rm \
            -e PGPASSWORD="$DB_PASS" \
            -v /tmp:/tmp \
            postgres:16-alpine \
            pg_dump -h '${{ vars.AURORA_ENDPOINT }}' \
              -U dbadmin \
              -d life_story_agent \
              --no-owner --no-acl \
              -f "$DUMP_FILE" 2>/dev/null
          DUMP_EXIT=$?

          if [ $DUMP_EXIT -eq 0 ]; then
            if [ -s "$DUMP_FILE" ]; then
              aws s3 cp "$DUMP_FILE" s3://${{ vars.DB_STORAGE_BUCKET }}/backups/aurora-$(date +%Y%m%d-%H%M%S).sql
              echo "✓ Aurora DB backup saved to s3://${{ vars.DB_STORAGE_BUCKET }}/backups/"
              FILE_SIZE=$(stat -f%z "$DUMP_FILE" 2>/dev/null || stat -c%s "$DUMP_FILE" 2>/dev/null)
              echo "  Backup size: $FILE_SIZE bytes"
            else
              echo "✓ Aurora accessible but database is empty (no tables or data)"
              echo "  Empty dump file created but not uploaded to S3 (no data to preserve)"
            fi
            rm -f "$DUMP_FILE"
          else
            echo "✗ Aurora DB backup failed (exit code: $DUMP_EXIT)"
            echo "  Aurora may be paused, unreachable, or credentials invalid"
            echo "  Proceeding with destroy anyway..."
            rm -f "$DUMP_FILE" 2>/dev/null
          fi
          echo "=== Aurora DB Backup Complete ==="

      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        id: destroy
        run: |
          cd terraform && terraform destroy -auto-approve

      - name: Cleanup Secrets Manager
        if: inputs.action == 'destroy'
        run: |
          aws secretsmanager delete-secret \
            --secret-id life-story-agent/production/db-password \
            --force-delete-without-recovery \
            2>/dev/null || true

      - name: Get Terraform Outputs
        if: inputs.action == 'apply'
        id: outputs
        run: |
          echo "api_url=$(cd terraform && terraform output -raw api_url)" >> $GITHUB_OUTPUT
          echo "cloudfront_url=$(cd terraform && terraform output -raw cloudfront_url)" >> $GITHUB_OUTPUT
          echo "cognito_user_pool_id=$(cd terraform && terraform output -raw cognito_user_pool_id)" >> $GITHUB_OUTPUT
          echo "cognito_client_id=$(cd terraform && terraform output -raw cognito_client_id)" >> $GITHUB_OUTPUT
          echo "audio_bucket_name=$(cd terraform && terraform output -raw audio_bucket_name)" >> $GITHUB_OUTPUT
          echo "aurora_endpoint=$(cd terraform && terraform output -raw aurora_endpoint)" >> $GITHUB_OUTPUT
          echo "db_credentials_arn=$(cd terraform && terraform output -raw db_credentials_arn)" >> $GITHUB_OUTPUT
          echo "ecr_repository_url=$(cd terraform && terraform output -raw ecr_repository_url)" >> $GITHUB_OUTPUT
          echo "ssm_parameter_path=$(cd terraform && terraform output -raw ssm_parameter_path)" >> $GITHUB_OUTPUT
          echo "ecs_cluster_name=$(cd terraform && terraform output -raw ecs_cluster_name)" >> $GITHUB_OUTPUT
          echo "ecs_service_name=$(cd terraform && terraform output -raw ecs_service_name)" >> $GITHUB_OUTPUT
          echo "frontend_bucket_name=$(cd terraform && terraform output -raw frontend_bucket_name)" >> $GITHUB_OUTPUT
          echo "cf_distribution_id=$(cd terraform && terraform output -raw cf_distribution_id)" >> $GITHUB_OUTPUT
          echo "db_storage_bucket_name=$(cd terraform && terraform output -raw db_storage_bucket_name)" >> $GITHUB_OUTPUT

      - name: Set GitHub Variables
        if: inputs.action == 'apply'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: wszymilo/life-story-agent
        run: |
          declare -A TF_OUTPUTS=(
            [FRONTEND_API_URL]=api_url
            [CLOUDFRONT_URL]=cloudfront_url
            [COGNITO_USER_POOL_ID]=cognito_user_pool_id
            [COGNITO_CLIENT_ID]=cognito_client_id
            [AUDIO_BUCKET]=audio_bucket_name
            [AURORA_ENDPOINT]=aurora_endpoint
            [DB_CREDENTIALS_ARN]=db_credentials_arn
            [ECR_REPOSITORY_URL]=ecr_repository_url
            [SSM_PARAMETER_PATH]=ssm_parameter_path
            [ECS_CLUSTER_NAME]=ecs_cluster_name
            [ECS_SERVICE_NAME]=ecs_service_name
            [FRONTEND_BUCKET]=frontend_bucket_name
            [CF_DISTRIBUTION_ID]=cf_distribution_id
            [DB_STORAGE_BUCKET]=db_storage_bucket_name
          )
          for gh_var in "${!TF_OUTPUTS[@]}"; do
            tf_var="${TF_OUTPUTS[$gh_var]}"
            value=$(cd terraform && terraform output -raw $tf_var)
            http_code=$(curl -s -w "%{http_code}" -o /dev/null -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/variables/$gh_var" \
              -d "{\"name\":\"$gh_var\",\"value\":\"$value\"}")
            if [ "$http_code" = "404" ]; then
              curl -s -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$REPO/actions/variables" \
                -d "{\"name\":\"$gh_var\",\"value\":\"$value\"}"
            fi
          done

      - name: Clear GitHub Variables
        if: inputs.action == 'destroy'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: wszymilo/life-story-agent
        run: |
          for var in FRONTEND_API_URL CLOUDFRONT_URL COGNITO_USER_POOL_ID COGNITO_CLIENT_ID AUDIO_BUCKET AURORA_ENDPOINT DB_CREDENTIALS_ARN ECR_REPOSITORY_URL SSM_PARAMETER_PATH ECS_CLUSTER_NAME ECS_SERVICE_NAME FRONTEND_BUCKET CF_DISTRIBUTION_ID DB_STORAGE_BUCKET; do
            curl -s -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/variables/$var" \
              || true
          done
          echo "GitHub Variables cleared"
