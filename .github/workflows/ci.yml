name: CI

on:
  push:          # tests on all branches
  pull_request:  # tests on all PRs

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: app
        run: uv sync

      - name: Lint
        working-directory: app
        run: uv run ruff check .

      - name: Type check
        working-directory: app
        run: uv run mypy main.py --ignore-missing-imports --no-error-summary || true

      - name: Tests
        working-directory: app
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm run test:run

      - name: Build
        run: npm run build

  deploy:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/lsa/life-story-agent
            git pull
            docker compose --env-file .env \
                           -f deploy/backend/docker-compose.yml \
                           -f deploy/backend/docker-compose.prod.yml \
                           up -d --build
