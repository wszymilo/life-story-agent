[project]
name = "life-story-agent"
version = "0.1.0"
description = "Life Story Preservation Agent - AI oral historian"
requires-python = ">=3.12"
members = ["app/"]

[tool.uv]
dev-dependencies = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python-version = "3.12"
strict = true
ignore-missing-imports = true