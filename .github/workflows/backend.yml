name: Deploy Backend

on:
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Build & Deploy FastAPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
      actions: read

    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-1.amazonaws.com/${{ vars.PROJECT_NAME }}/fastapi
          tags: |
            type=ref,event=branch
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: aws/
          dockerfile: aws/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ vars.PROJECT_NAME }}-cluster \
            --service ${{ vars.PROJECT_NAME }}-fastapi-service \
            --force-new-deployment \
            --region eu-west-1

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster ${{ vars.PROJECT_NAME }}-cluster \
            --services ${{ vars.PROJECT_NAME }}-fastapi-service \
            --region eu-west-1

      - name: Health check
        run: |
          BACKEND_URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ vars.PROJECT_NAME }}-alb \
            --region eu-west-1 \
            --query 'Stacks[0].Outputs[?OutputKey=="LoadBalancerDNSName"].OutputValue' \
            --output text)
          echo "Backend URL: http://$BACKEND_URL"
          curl --retry 5 --retry-delay 10 --fail http://$BACKEND_URL/health
